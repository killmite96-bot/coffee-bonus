<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Касса — бонусная система</title>
<link rel="icon" href="../assets/icon.svg">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="wrap">
  <div class="brand"><h1 id="title">Касса</h1><button class="ghost small" id="logout" hidden>Выйти</button></div>
  <div id="view" class="view"></div>
</div>
<script src="../assets/vendor/jsQR.js"></script>
<script src="../assets/config.js"></script>
<script src="../assets/common.js"></script>
<script>
const view = $('#view');
let stream = null, scanning = false, cred = null, sheet = null;

function showLogin() {
  stopScan();
  $('#logout').hidden = true;
  $('#title').textContent = 'Касса';
  view.innerHTML = `
    <div class="card">
      <span class="hero-emoji">🔐</span>
      <p class="lead" style="margin-bottom:6px">Вход для сотрудников</p>
      <label for="pin">PIN сотрудника</label>
      <div class="row">
        <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Введите PIN">
        <button class="ghost" id="eye" type="button">Показать</button>
      </div>
      <p style="margin:12px 0 0"></p><button class="big" id="go">Войти</button>
    </div>`;
  $('#pin').focus();
  $('#eye').onclick = () => {
    const p = $('#pin'), show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    $('#eye').textContent = show ? 'Скрыть' : 'Показать';
    p.focus();
  };
  const go = async () => {
    try { await api('/api/staff/login', 'POST', { pin: $('#pin').value }); haptic(); boot(); }
    catch (e) { toast(e.message, 'err'); }
  };
  $('#go').onclick = go;
  $('#pin').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

function showMain(me) {
  $('#logout').hidden = false;
  $('#title').textContent = '📍 ' + me.location;
  view.innerHTML = `
    <div class="card" id="scanCard">
      <h2>Найти клиента</h2>
      <button class="big" id="scanBtn">📷 Сканировать QR</button>
      <video id="video" playsinline muted hidden style="margin-top:14px"></video>
      <p id="camInfo" class="muted center" hidden style="font-size:12px;margin:8px 0 0"></p>
      <button class="ghost small" id="camBtn" hidden style="margin:10px auto 0;display:block">🔄 Сменить камеру</button>
      <p style="margin:10px 0 0"></p>
      <button class="big ghost" id="photoBtn">📸 Сфотографировать QR камерой телефона</button>
      <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
      <p class="muted center" style="margin:16px 0 0">или введите вручную</p>
      <div class="row">
        <div><label for="card">№ карты</label><input id="card" inputmode="numeric" autocomplete="off"></div>
        <div><label for="code">Код</label><input id="code" inputmode="numeric" autocomplete="off" maxlength="7"></div>
      </div>
      <p style="margin:12px 0 0"></p><button class="big ghost" id="manual">Найти</button>
    </div>
    <div class="card"><h2>Последние операции</h2><ul class="list" id="recent"></ul></div>`;
  $('#scanBtn').onclick = () => scanning ? stopScan() : startScan();
  $('#manual').onclick = () => lookup({ card: $('#card').value, code: $('#code').value });
  $('#photoBtn').onclick = () => { stopScan(); $('#photoInput').click(); };
  $('#camBtn').onclick = nextCamera;
  $('#photoInput').onchange = onPhoto;
  loadRecent();
}

async function loadRecent() {
  const { items } = await api('/api/staff/recent');
  $('#recent').innerHTML = items.length
    ? items.map(i => `<li style="${i.cancelled ? 'opacity:.45;text-decoration:line-through' : ''}">
        <span><b>${rub(i.amount)}</b> ${purchaseDelta(i)} · ${esc(i.name)}<br>
        <span class="muted" style="font-size:13px">${fmtDate(i.created_at)}</span></span>
        ${i.can_cancel ? `<button class="ghost small" data-cancel="${i.id}">Отменить</button>` : ''}</li>`).join('')
    : '<li class="muted">Операций пока нет</li>';
  document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => {
    if (!await confirmSheet('Отменить операцию?', 'Бонусы будут пересчитаны, клиент получит уведомление.', 'Отменить операцию')) return;
    try { await api('/api/staff/cancel', 'POST', { event_id: +b.dataset.cancel }); toast('Операция отменена'); loadRecent(); }
    catch (e) { toast(e.message, 'err'); }
  });
}

async function lookup(c) {
  if (sheet) return;
  try {
    const d = await api('/api/staff/lookup', 'POST', c);
    cred = c;
    stopScan();
    haptic();
    showCustomer(d);
  } catch (e) {
    toast(e.message, 'err');
    if (e.status === 401) boot();
    else if (scanning) scanLoop();
  }
}

// Карточка клиента выезжает снизу, как шторка в iOS.
function showCustomer(d) {
  sheet = openSheet(`
    <p class="who">${esc(d.user.name)}</p>
    <p class="muted center" style="margin:0">Карта № ${d.user.id}</p>
    ${balanceBlock(d.balance)}
    <label for="amount">Сумма чека, ₽</label>
    <input id="amount" type="number" inputmode="numeric" min="1" step="1" placeholder="0" autocomplete="off">
    <label for="spend">Списать бонусов <span id="maxhint" style="text-transform:none;letter-spacing:0;font-weight:400"></span></label>
    <div class="row">
      <input id="spend" type="number" inputmode="numeric" min="0" step="1" placeholder="0" autocomplete="off">
      <button class="ghost" id="max">Максимум</button>
    </div>
    <div class="summary" id="sum"></div>
    <button class="big ok" id="act" disabled>Провести покупку</button>
    <p style="margin:8px 0 0"></p><button class="big ghost" id="cancel">Отмена</button>`, () => { sheet = null; cred = null; });
  const el = sheet.el;
  animateNumbers(el);
  const amount = el.querySelector('#amount'), spend = el.querySelector('#spend');
  let total = 0, s = 0, max = 0;
  // Те же формулы, что в базе (база перепроверяет всё сама).
  const calc = () => {
    total = Math.max(0, parseInt(amount.value) || 0);
    max = Math.min(d.balance, Math.floor(total * d.max_spend_percent / 100));
    s = Math.max(0, parseInt(spend.value) || 0);
    if (s > max) { s = max; spend.value = s || ''; }
    const paid = total - s, earned = Math.floor(paid * d.earn_percent / 100);
    el.querySelector('#maxhint').textContent = total ? `· не больше ${max} (${d.max_spend_percent}% чека)` : '';
    el.querySelector('#sum').innerHTML = `
      <div><span>Чек</span><span>${rub(total)}</span></div>
      <div><span>Списано бонусами</span><span class="${s ? 'minus' : ''}">${s ? '−' + rub(s) : '—'}</span></div>
      <div class="total"><span>К оплате</span><span>${rub(paid)}</span></div>
      <div><span>Будет начислено</span><span class="plus">+${earned} ${bonusWord(earned)}</span></div>`;
    el.querySelector('#act').disabled = total < 1;
  };
  amount.oninput = spend.oninput = calc;
  el.querySelector('#max').onclick = () => { spend.value = max || ''; calc(); haptic(); };
  calc();
  setTimeout(() => amount.focus(), 350);
  el.querySelector('#cancel').onclick = () => sheet.close();
  el.querySelector('#act').onclick = async () => {
    const act = el.querySelector('#act');
    act.disabled = true;
    try {
      const r = await api('/api/staff/purchase', 'POST', { ...cred, amount: total, spend: s });
      sheet.close();
      celebrate(`К оплате ${rub(r.paid)}`);
      toast(`Начислено ${r.earned} ${bonusWord(r.earned)}`);
      $('#card').value = $('#code').value = '';
      loadRecent();
    } catch (e) {
      toast(e.message, 'err');
      if (e.status === 401) { sheet.close(); boot(); } else act.disabled = false;
    }
  };
}

// ---------------------------------------------------------------- сканер

// Распознаватель QR: встроенный в браузер (быстрый, есть в Chrome на Android), иначе jsQR.
const detector = 'BarcodeDetector' in window ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
const scratch = document.createElement('canvas');
const sctx = scratch.getContext('2d', { willReadFrequently: true });

// Возвращает текст QR-кода из кадра или снимка (video / img / canvas / bitmap) либо null.
async function decodeFrame(src, w, h, maxW = 800) {
  if (detector) {
    try {
      const found = await detector.detect(src);
      if (found.length) return found[0].rawValue;
    } catch { /* не получилось — пробуем jsQR */ }
  }
  const k = Math.min(1, maxW / w);              // большой кадр уменьшаем: для QR хватает и этого, а телефон не тормозит
  scratch.width = Math.round(w * k);
  scratch.height = Math.round(h * k);
  sctx.drawImage(src, 0, 0, scratch.width, scratch.height);
  const img = sctx.getImageData(0, 0, scratch.width, scratch.height);
  const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });
  return code ? code.data : null;
}

const CAM_KEY = 'bonus_cam';
function savedCam() { try { return localStorage.getItem(CAM_KEY) || ''; } catch { return ''; } }
function saveCam(id) { try { localStorage.setItem(CAM_KEY, id); } catch { /* приватный режим */ } }

// Переключение между камерами телефона (основная, сверхширокая, макро…). Выбор запоминается.
async function nextCamera() {
  const cams = (await navigator.mediaDevices.enumerateDevices())
    .filter(d => d.kind === 'videoinput' && !/front|фронт|user|селфи/i.test(d.label));
  if (cams.length < 2) return toast('Другой задней камеры не видно', 'err');
  const cur = stream && stream.getVideoTracks()[0].getSettings().deviceId;
  const i = cams.findIndex(d => d.deviceId === cur);
  saveCam(cams[(i + 1) % cams.length].deviceId);
  haptic();
  stopScan();
  await startWebScan();
}

// Камера: сначала строго HD, если не вышло — мягче; в самом конце — что дадут.
async function openCamera() {
  const back = { facingMode: { ideal: 'environment' } };
  const attempts = [
    { ...back, width: { min: 1280 }, height: { min: 720 } },
    { ...back, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } },
    { ...back, width: { ideal: 1280 }, height: { ideal: 720 } },
    back,
  ];
  const saved = savedCam();     // у телефона может быть несколько задних камер — используем выбранную вручную
  if (saved) attempts.unshift({ deviceId: { exact: saved }, width: { ideal: 1920 }, height: { ideal: 1080 } });
  let err;
  for (const video of attempts) {
    try { return await navigator.mediaDevices.getUserMedia({ audio: false, video }); }
    catch (e) { err = e; if (e.name === 'NotAllowedError' || e.name === 'SecurityError') throw e; }
  }
  throw err;
}

// В приложении сканирует родная камера (чёткая, с автофокусом); результат приходит в onNativeQr.
window.onNativeQr = text => { if (text && text.startsWith('BC1.')) lookup({ payload: text }); };
// Если родная камера не открылась — сразу пробуем обычный веб-сканер.
window.onNativeQrError = msg => { toast(msg + ' Включаю обычный сканер.', 'err'); startWebScan(); };

async function startScan() {
  if (window.AndroidApp && AndroidApp.scanQr) { AndroidApp.scanQr(); return; }
  return startWebScan();
}

async function startWebScan() {
  const video = $('#video');
  try {
    stream = await openCamera();
  } catch {
    return toast('Нет доступа к камере. Нажмите «Сфотографировать QR» или введите код вручную', 'err');
  }
  const track = stream.getVideoTracks()[0];
  try {   // непрерывная автофокусировка, если камера её умеет
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.includes('continuous')) {
      await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
    }
  } catch { /* не критично */ }
  try {   // если камера умеет больше, чем дал браузер — просим максимум (до Full HD)
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    const have = track.getSettings();
    const maxW = caps.width && caps.width.max, maxH = caps.height && caps.height.max;
    if (maxW && have.width < Math.min(maxW, 1920)) {
      await track.applyConstraints({ width: { ideal: Math.min(maxW, 1920) }, height: { ideal: Math.min(maxH || 1080, 1080) } });
    }
  } catch { /* не критично */ }
  video.srcObject = stream;
  video.hidden = false;
  await video.play();
  showCamInfo(video);
  $('#camBtn').hidden = false;
  scanning = true;
  $('#scanBtn').textContent = 'Остановить камеру';
  scanLoop();
}

// Что камера реально отдаёт странице: по этой строке видно, не урезано ли качество.
function showCamInfo(video) {
  const info = $('#camInfo');
  if (!info || !stream) return;
  const t = stream.getVideoTracks()[0], s = t.getSettings ? t.getSettings() : {};
  const caps = t.getCapabilities ? t.getCapabilities() : {};
  info.textContent = `Камера: ${video.videoWidth || s.width}×${video.videoHeight || s.height}`
    + (s.frameRate ? `, ${Math.round(s.frameRate)} к/с` : '')
    + (s.facingMode ? `, ${s.facingMode === 'environment' ? 'задняя' : s.facingMode}` : '')
    + ` · максимум ${caps.width ? caps.width.max : '?'}`
    + (t.label ? ` · ${t.label}` : '')
    + ` · ${detector ? 'встроенный распознаватель' : 'jsQR'}`;
  info.hidden = false;
}

function stopScan() {
  scanning = false;
  const ci = $('#camInfo'); if (ci) ci.hidden = true;
  const cb = $('#camBtn'); if (cb) cb.hidden = true;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  const v = $('#video'), b = $('#scanBtn');
  if (v) v.hidden = true;
  if (b) b.textContent = '📷 Сканировать QR';
}

function scanLoop() {
  const video = $('#video');
  let busy = false;
  const tick = async () => {
    if (!scanning) return;
    if (!busy && video.readyState >= 2 && video.videoWidth) {
      busy = true;
      let text = null;
      try { text = await decodeFrame(video, video.videoWidth, video.videoHeight); }
      finally { busy = false; }
      if (text && text.startsWith('BC1.')) return lookup({ payload: text });
    }
    setTimeout(tick, 120);
  };
  tick();
}

// Снимок обычной камерой телефона — резкий, с автофокусом и без «пикселей» живого видео.
async function onPhoto(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  toast('Распознаю QR…');
  try {
    const bmp = await createImageBitmap(file);
    let text = await decodeFrame(bmp, bmp.width, bmp.height, 1600);
    if (!text) text = await decodeFrame(bmp, bmp.width, bmp.height, 900);   // на мелком снимке иногда лучше читается
    if (bmp.close) bmp.close();
    if (text && text.startsWith('BC1.')) return lookup({ payload: text });
    toast(text ? 'Это не карта лояльности' : 'QR не найден. Снимите ближе и ровнее', 'err');
  } catch {
    toast('Не удалось прочитать снимок', 'err');
  }
}

async function boot() {
  try { showMain(await api('/api/staff/me')); } catch { showLogin(); }
}

$('#logout').onclick = async () => { stopScan(); await api('/api/logout', 'POST', {}); boot(); };
boot();
</script>
</body>
</html>
