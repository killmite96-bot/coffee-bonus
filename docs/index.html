<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Бонусная карта</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <div class="brand"><h1 id="shop">☕ Кофейня</h1><button class="ghost small" id="logout" hidden>Выйти</button></div>
  <div id="view" class="view"></div>
</div>
<script src="assets/vendor/qrcode.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/common.js"></script>
<script>
let cfg, timers = [], prevBalance = 0, last = '';
const view = $('#view');

function clearTimers() { timers.forEach(clearInterval); timers = []; }

function skeleton() {
  view.innerHTML = `<div class="card"><div class="skeleton" style="height:22px;width:50%;margin:0 auto 18px"></div>
    <div class="skeleton" style="height:64px;width:70%;margin:0 auto"></div></div>
    <div class="card"><div class="skeleton" style="height:240px"></div></div>`;
}

function showLogin() {
  clearTimers();
  $('#logout').hidden = true;
  view.innerHTML = `
    <div class="card center">
      <span class="hero-emoji">🎁</span>
      <p class="lead">Возвращаем бонусами<br>с каждой покупки</p>
      <p class="muted" style="margin:10px 0 18px">Войдите, чтобы получить свою карту. Показывайте QR на кассе — бонусы копятся сами, а потом ими можно оплатить часть заказа.</p>
      <div id="login"></div>
    </div>
    <p class="muted center"><a href="barista/" style="color:inherit">Для сотрудников</a> · <a href="admin/" style="color:inherit">Администратору</a></p>`;
  const box = $('#login');
  if (cfg.dev) {
    box.innerHTML = `
      <label for="n" style="text-align:left">Тестовый вход — ваше имя</label>
      <input id="n" placeholder="Например, Анна" autocomplete="off">
      <p style="margin:12px 0 0"></p><button class="big" id="go">Войти</button>
      <p class="muted" style="margin:14px 0 0">Режим разработки: бот Telegram ещё не подключён.</p>`;
    const go = async () => {
      try { await api('/api/auth/dev', 'POST', { name: $('#n').value }); haptic(); boot(); }
      catch (e) { toast(e.message, 'err'); }
    };
    $('#go').onclick = go;
    $('#n').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  } else {
    const s = document.createElement('script');
    s.async = true;
    s.src = 'https://telegram.org/js/telegram-widget.js?22';
    s.dataset.telegramLogin = cfg.bot_username;
    s.dataset.size = 'large';
    s.dataset.radius = '16';
    s.dataset.authUrl = new URL('auth/', location.href).href; // вход через редирект — работает и в приложении
    s.dataset.requestAccess = 'write';
    box.appendChild(s);
  }
}

function showCard(me) {
  $('#logout').hidden = false;
  view.innerHTML = `
    <div class="card center">
      <p class="muted" style="margin:0;font-weight:500">Здравствуйте, ${esc(me.user.name)}</p>
      <div id="bal"></div>
      <p class="muted" id="rules" style="margin:12px 0 0"></p>
    </div>
    <div class="card center">
      <h2 style="margin-bottom:6px">Покажите баристе</h2>
      <div class="qrring" id="ring"><div class="qrbox" id="qr"></div></div>
      <p class="muted" style="margin:14px 0 2px">Если сканер не работает, назовите:</p>
      <div class="muted">Карта № <b id="card" style="color:var(--ink)"></b></div>
      <div class="code" id="code"></div>
    </div>
    <div class="card"><h2>История</h2><ul class="list" id="hist"></ul></div>`;
  last = ''; paint(me);

  let expiresAt = 0, first = true;
  const loadQr = async () => {
    try {
      const q = await api('/api/qr');
      const qr = qrcode(0, 'M');
      qr.addData(q.payload);
      qr.make();
      const box = $('#qr');
      box.innerHTML = qr.createSvgTag({ scalable: true, margin: 0 });
      if (!first) { box.classList.remove('refresh'); void box.offsetWidth; box.classList.add('refresh'); }   // лёгкая «пульсация» при обновлении
      first = false;
      $('#card').textContent = q.card;
      $('#code').textContent = q.code.slice(0, 3) + ' ' + q.code.slice(3);
      expiresAt = Date.now() + q.expires_in * 1000;
    } catch (e) { if (e.status === 401) boot(); }
  };
  loadQr();
  timers.push(setInterval(() => {
    const left = (expiresAt - Date.now()) / 1000;
    const ring = $('#ring');
    if (ring) ring.style.setProperty('--p', Math.max(0, left / 30 * 100));
    if (left <= 1) { expiresAt = Date.now() + 5000; loadQr(); }
  }, 500));
  // подтягиваем баланс, пока клиент ждёт у кассы
  timers.push(setInterval(async () => {
    try { paint(await api('/api/me')); } catch (e) { if (e.status === 401) boot(); }
  }, 6000));
}

function paint(me) {
  const key = JSON.stringify([me.balance, me.history.length]);
  if (key === last) return;
  const changed = last && JSON.parse(last)[0] !== me.balance;
  if (changed) {
    const d = me.balance - prevBalance;
    toast(d > 0 ? `+${d} ${bonusWord(d)} 🎉` : `Баланс: ${me.balance} ${bonusWord(me.balance)}`);
    haptic([14, 30, 14]);
  }
  last = key;
  $('#bal').innerHTML = balanceBlock(me.balance, prevBalance);
  animateNumbers($('#bal'));
  prevBalance = me.balance;
  $('#rules').textContent = `Начисляем ${me.earn_percent}% с каждой покупки. Бонусами можно оплатить до ${me.max_spend_percent}% чека.`;
  $('#hist').innerHTML = me.history.length
    ? me.history.map(h => `<li><span>Покупка ${rub(h.amount)}
        <span class="muted">· ${esc(h.location || '')}</span><br><span class="muted" style="font-size:13px">${fmtDate(h.created_at)}</span></span>
        <span style="font-size:18px">${purchaseDelta(h)}</span></li>`).join('')
    : '<li class="muted">Пока пусто — самое время за первой покупкой</li>';
}

async function boot() {
  clearTimers();
  last = '';
  skeleton();
  try { cfg = cfg || await api('/api/config'); }
  catch (e) {
    view.innerHTML = `<div class="card center"><p class="lead">Сайт временно недоступен</p><p class="muted">${esc(e.message)}</p></div>`;
    return;
  }
  $('#shop').textContent = '☕ ' + cfg.shop_name;
  document.title = cfg.shop_name + ' — бонусная карта';
  try { showCard(await api('/api/me')); } catch { showLogin(); }
}

$('#logout').onclick = async () => { await api('/api/logout', 'POST', {}); prevBalance = 0; boot(); };
boot();
</script>
</body>
</html>
