<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Бонусная карта</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <div class="brand"><h1 id="shop">☕ Кофейня</h1><button class="ghost small" id="logout" hidden>Выйти</button></div>
  <div id="view" class="view"></div>
</div>
<script src="assets/vendor/qrcode.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/common.js"></script>
<script>
let cfg, timers = [], cleanups = [], prevBalance = 0, last = '', authMode = null;
const view = $('#view');

function clearTimers() { timers.forEach(clearInterval); timers = []; cleanups.forEach(f => f()); cleanups = []; }

function skeleton() {
  view.innerHTML = `<div class="card"><div class="skeleton" style="height:22px;width:50%;margin:0 auto 18px"></div>
    <div class="skeleton" style="height:64px;width:70%;margin:0 auto"></div></div>
    <div class="card"><div class="skeleton" style="height:240px"></div></div>`;
}

// ---------------------------------------------------------------- вход, регистрация, восстановление

const seen = () => { try { return !!localStorage.getItem('bonus_seen'); } catch { return false; } };
const markSeen = () => { try { localStorage.setItem('bonus_seen', '1'); } catch { /* приватный режим */ } };

function showLogin() {
  clearTimers();
  $('#logout').hidden = true;
  if (!authMode) authMode = seen() ? 'login' : 'register';     // новый человек сначала видит регистрацию
  view.innerHTML = `
    <div class="card center">
      <span class="hero-emoji">🎁</span>
      <p class="lead">Возвращаем бонусами<br>с каждой покупки</p>
      <p class="muted" style="margin:10px 0 18px">Показывайте QR на кассе — бонусы копятся сами, а потом ими можно оплатить часть заказа.</p>
      <div class="tabs" id="authTabs">
        <button data-m="register">Регистрация</button><button data-m="login">Вход</button>
      </div>
      <form class="authform" id="authForm" novalidate autocomplete="off"></form>
      <div id="alt"></div>
    </div>
    <p class="muted center"><a href="barista/" style="color:inherit">Для сотрудников</a> · <a href="admin/" style="color:inherit">Администратору</a></p>`;
  document.querySelectorAll('#authTabs button').forEach(b => b.onclick = () => { authMode = b.dataset.m; haptic(6); showLogin(); });
  renderAuthForm();
  renderAlternatives();
}

function passField(id, placeholder = 'Пароль') {
  return `<div class="field-pass"><input id="${id}" type="text" class="secret" autocomplete="off" placeholder="${placeholder}"
            autocapitalize="none" autocorrect="off" spellcheck="false"><button type="button" class="eye">Показать</button></div>`;
}

const loginField = hint => `
    <label for="a-login">Логин</label>
    <input id="a-login" autocomplete="off" placeholder="например, anna_k" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="30">
    ${hint ? '<p class="hint">Латиница, цифры, точка, дефис или подчёркивание. От 3 символов.</p>' : ''}`;

function renderAuthForm() {
  document.querySelectorAll('#authTabs button').forEach(b => b.classList.toggle('on', b.dataset.m === authMode));
  const reg = authMode === 'register', rec = authMode === 'recover';
  const form = $('#authForm');
  form.innerHTML = rec ? `
    <p class="muted" style="margin:0 0 2px;text-align:center">Введите логин, код восстановления (его показали при регистрации) и придумайте новый пароль.</p>
    ${loginField(false)}
    <label for="a-code">Код восстановления</label>
    <input id="a-code" class="codeinput" autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="24"
           autocapitalize="characters" autocorrect="off" spellcheck="false">
    <label for="a-pass">Новый пароль</label>${passField('a-pass', 'Новый пароль')}
    <p style="margin:16px 0 0"></p>
    <button class="big" id="a-go" type="submit">Восстановить доступ</button>
    <p class="center" style="margin:4px 0 0"><button type="button" class="linkbtn" id="back">← Назад ко входу</button></p>` : `
    ${reg ? `<label for="a-name">Имя</label>
      <input id="a-name" autocomplete="off" placeholder="Как вас называть" maxlength="60">` : ''}
    ${loginField(reg)}
    <label for="a-pass">Пароль</label>
    ${passField('a-pass')}
    ${reg ? '<p class="hint">Не короче 6 символов. После регистрации вы получите код восстановления на случай, если забудете пароль.</p>' : ''}
    <p style="margin:16px 0 0"></p>
    <button class="big" id="a-go" type="submit">${reg ? 'Создать карту' : 'Войти'}</button>
    ${reg ? '' : '<p class="center" style="margin:4px 0 0"><button type="button" class="linkbtn" id="forgot">Забыли пароль?</button></p>'}`;

  bindSecretToggle($('#a-pass'), form.querySelector('.eye'));
  const back = $('#back'), forgot = $('#forgot');
  if (back) back.onclick = () => { authMode = 'login'; showLogin(); };
  if (forgot) forgot.onclick = () => { authMode = 'recover'; showLogin(); };

  form.onsubmit = async e => {
    e.preventDefault();
    const login = $('#a-login').value.trim(), password = $('#a-pass').value;
    const name = reg ? $('#a-name').value.trim() : '', code = rec ? $('#a-code').value.trim() : '';
    if (reg && !name) return toast('Введите имя', 'err');
    if (!login) return toast('Введите логин', 'err');
    if (rec && !code) return toast('Введите код восстановления', 'err');
    if (!password) return toast(rec ? 'Введите новый пароль' : 'Введите пароль', 'err');
    const go = $('#a-go'); go.disabled = true;
    try {
      const r = await api(reg ? '/api/auth/register' : rec ? '/api/auth/recover' : '/api/auth/login', 'POST',
                          { name, login, password, code });
      markSeen(); haptic([12, 30, 12]);
      authMode = null; prevBalance = 0;
      // регистрация и восстановление выдают код: показываем его до того, как человек попадёт на карту
      if (r.recovery_code) showRecovery(r.recovery_code, rec ? 'Пароль изменён. Новый код восстановления' : 'Сохраните код восстановления', boot);
      else boot();
    } catch (err) { go.disabled = false; toast(err.message, 'err'); }
  };
}

// Код восстановления показывается один раз и сразу даёт скопировать его.
function showRecovery(code, title, onClose) {
  const s = openSheet(`
    <h2 style="text-align:center">${esc(title)}</h2>
    <p class="muted center" style="margin:0 0 14px">Если забудете пароль, войти снова поможет только этот код. Сохраните его в заметках или запишите. Больше мы его не покажем.</p>
    <div class="reccode">${esc(code)}</div>
    <p style="margin:14px 0 0"></p><button class="big ghost" id="rc-copy">Скопировать</button>
    <p style="margin:8px 0 0"></p><button class="big" id="rc-ok">Я сохранил код</button>`, onClose);
  s.el.querySelector('#rc-copy').onclick = async () => toast(await copyText(code) ? 'Код скопирован' : 'Не удалось скопировать — выделите код пальцем', 'ok');
  s.el.querySelector('#rc-ok').onclick = () => s.close();
}

// Вход через Telegram (если подключён бот) и тестовый вход по имени (только если включён в базе).
function renderAlternatives() {
  const box = $('#alt');
  if (cfg.bot_username) {
    box.innerHTML = '<div class="or">или</div><div id="tg"></div>';
    const s = document.createElement('script');
    s.async = true;
    s.src = 'https://telegram.org/js/telegram-widget.js?22';
    s.dataset.telegramLogin = cfg.bot_username;
    s.dataset.size = 'large';
    s.dataset.radius = '16';
    s.dataset.authUrl = new URL('auth/', location.href).href;   // вход через редирект — работает и в приложении
    s.dataset.requestAccess = 'write';
    $('#tg').appendChild(s);
  }
  if (cfg.dev) {
    box.insertAdjacentHTML('beforeend', `<div class="or">тест</div>
      <div class="row"><input id="dev-name" placeholder="Имя без пароля (только для проверок)"><button class="ghost" id="dev-go">Войти</button></div>`);
    $('#dev-go').onclick = async () => {
      try { await api('/api/auth/dev', 'POST', { name: $('#dev-name').value }); boot(); }
      catch (e) { toast(e.message, 'err'); }
    };
  }
}

// ---------------------------------------------------------------- карточка клиента

function showCard(me) {
  $('#logout').hidden = false;
  view.innerHTML = `
    <div class="card center">
      <p class="muted" style="margin:0;font-weight:500">Здравствуйте, ${esc(me.user.name)}</p>
      <div id="bal"></div>
      <p class="muted" id="rules" style="margin:12px 0 0"></p>
    </div>
    <div class="card center">
      <h2 style="margin-bottom:6px">Покажите баристе</h2>
      <div class="qrring" id="ring"><div class="qrbox" id="qr"></div></div>
      <p class="muted" style="margin:14px 0 2px">Если сканер не работает, назовите:</p>
      <div class="muted">Карта № <b id="card" style="color:var(--ink)"></b></div>
      <div class="code" id="code"></div>
    </div>
    <div class="card" id="inboxCard" hidden><h2>Сообщения</h2><ul class="list" id="inbox"></ul></div>
    <div class="card"><h2>История</h2><ul class="list" id="hist"></ul></div>
    <div class="card" id="settings" hidden><h2>Уведомления и безопасность</h2><ul class="list" id="setList"></ul></div>`;
  last = ''; paint(me);
  renderSettings(me);
  startQr();
  syncApp();
  loadInbox();
  // подтягиваем баланс и новые сообщения, пока клиент ждёт у кассы
  timers.push(setInterval(async () => {
    try {
      paint(await api('/api/me'));
      const m = await api('/api/messages', 'POST', { after: msgLast });
      if (m.items.length) {
        msgLast = m.last_id;
        try { if (window.AndroidApp && AndroidApp.setSeen) AndroidApp.setSeen(msgLast); } catch { /* старое приложение */ }
        const n = m.items.filter(x => x.kind === 'promo' || /[⌛🎁]/u.test(x.body)).pop();   // о покупках уже сообщает баланс
        if (n) { toast(n.title === cfg.shop_name ? n.body : n.title + ': ' + n.body); haptic([14, 30, 14]); }
        loadInbox();
      }
    } catch (e) { if (e.status === 401) boot(); }
  }, 6000));
}

// ---- сообщения (покупки, акции, сгорание бонусов) ----
let msgLast = 0;
async function loadInbox() {
  try {
    const d = await api('/api/inbox');
    msgLast = d.items.length ? d.items[0].id : msgLast;
    try { if (window.AndroidApp && AndroidApp.setSeen) AndroidApp.setSeen(msgLast); } catch { /* старое приложение */ }
    const card = $('#inboxCard');
    if (!card) return;
    card.hidden = !d.items.length;
    $('#inbox').innerHTML = d.items.map(m => `<li style="display:block"><b>${m.kind === 'promo' ? '📣 ' : ''}${esc(m.title)}</b>
      <div style="margin:2px 0">${esc(m.body)}</div><span class="muted" style="font-size:13px">${fmtDate(m.created_at)}</span></li>`).join('');
  } catch { /* не мешаем карточке */ }
}

// Приложение-оболочка (Android) получает ключи доступа, чтобы показывать уведомления, даже когда оно закрыто.
function syncApp() {
  try {
    if (window.AndroidApp && AndroidApp.setSession) {
      AndroidApp.setSession(tokenGet('user'), window.APP_CONFIG.SUPABASE_URL, window.APP_CONFIG.SUPABASE_KEY);
    }
  } catch { /* старая версия приложения без этой функции */ }
}

// ---- настройки: push-уведомления и код восстановления ----
async function pushStatus() {
  if (!cfg.vapid_public) return 'off';                       // администратор ещё не подключил уведомления — раздел скрыт
  if (!pushSupported()) return 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  return (await pushSubscription()) ? 'on' : 'ready';
}

async function renderSettings(me) {
  const st = await pushStatus().catch(() => 'unsupported');
  const rows = [];
  if (st === 'unsupported') rows.push(`<li class="setrow"><span>Уведомления<small>В этом приложении или браузере уведомления с сайта недоступны. Откройте сайт в браузере (Chrome, Safari); на iPhone сначала добавьте его на главный экран.</small></span></li>`);
  if (st === 'denied') rows.push(`<li class="setrow"><span>Уведомления<small>Вы запретили их для этого сайта. Разрешите в настройках браузера и обновите страницу.</small></span></li>`);
  if (st === 'ready') rows.push(`<li class="setrow"><span>Уведомления<small>Сообщим о начислении и списании бонусов</small></span><button class="small" id="pushOn">Включить</button></li>`);
  if (st === 'on') rows.push(`<li class="setrow"><span><i class="dot ok"></i>Уведомления включены<small>На этом устройстве</small></span><button class="ghost small" id="pushOff">Выключить</button></li>`);
  if (me.has_password) rows.push(`<li class="setrow"><span>Код восстановления<small>Нужен, если забудете пароль. Новый код отменяет прежний.</small></span><button class="ghost small" id="newCode">Новый код</button></li>`);

  const card = $('#settings');
  if (!card) return;
  card.hidden = !rows.length;
  $('#setList').innerHTML = rows.join('');
  const again = async () => renderSettings(await api('/api/me'));
  const on = $('#pushOn'), off = $('#pushOff'), nc = $('#newCode');
  if (on) on.onclick = async () => {
    on.disabled = true;
    try { await enablePush(cfg.vapid_public); toast('Уведомления включены'); haptic(); }
    catch (e) { toast(e.message || 'Не удалось включить уведомления', 'err'); }
    again();
  };
  if (off) off.onclick = async () => {
    off.disabled = true;
    try { await disablePush(); toast('Уведомления выключены'); } catch (e) { toast(e.message, 'err'); }
    again();
  };
  if (nc) nc.onclick = async () => {
    if (!await confirmSheet('Выпустить новый код?', 'Прежний код перестанет работать. Новый показывается один раз.', 'Выпустить новый код')) return;
    try { showRecovery((await api('/api/recovery-code', 'POST', {})).recovery_code, 'Новый код восстановления'); }
    catch (e) { toast(e.message, 'err'); }
  };
}

// ---- QR: каждый код живёт ровно минуту, полоска-кольцо плавно идёт от полной к пустой,
//      а следующий код подгружается заранее и подменяется в тот же миг, без пауз и скачков.
function startQr() {
  let shownAt = 0, ttl = 60, next = null, fetching = false, first = true, dead = false;

  const draw = q => {
    const qr = qrcode(0, 'M');
    qr.addData(q.payload);
    qr.make();
    const box = $('#qr'), ring = $('#ring');
    if (!box || !ring) { dead = true; return; }
    box.innerHTML = qr.createSvgTag({ scalable: true, margin: 0 });
    if (!first) { box.classList.remove('refresh'); void box.offsetWidth; box.classList.add('refresh'); }   // лёгкая «пульсация» при смене кода
    first = false;
    $('#card').textContent = q.card;
    $('#code').textContent = q.code.slice(0, 3) + ' ' + q.code.slice(3);
    ttl = q.expires_in || 60;
    shownAt = Date.now();
    ring.classList.add('snap'); ring.style.setProperty('--p', 100);   // кольцо мгновенно снова полное
    void ring.offsetWidth; ring.classList.remove('snap');
  };
  const fetchQr = async () => { fetching = true; try { return await api('/api/qr'); } finally { fetching = false; } };

  fetchQr().then(draw).catch(e => { if (e.status === 401) boot(); });

  const tick = () => {
    if (dead || !shownAt) return;
    const elapsed = (Date.now() - shownAt) / 1000, left = Math.max(0, ttl - elapsed);
    const ring = $('#ring');
    if (!ring) { dead = true; return; }
    ring.style.setProperty('--p', (left / ttl * 100).toFixed(2));
    if (!next && !fetching && elapsed >= ttl - 6) {                    // за 6 секунд до конца готовим следующий код
      fetchQr().then(q => { next = q; }).catch(() => {});
    }
    if (elapsed >= ttl) {
      if (next) { const q = next; next = null; draw(q); }
      else if (!fetching) { fetchQr().then(draw).catch(e => { if (e.status === 401) boot(); }); }
    }
  };
  timers.push(setInterval(tick, 100));

  // вернулись на вкладку после долгой паузы — код мог устареть, берём свежий сразу
  const onVisible = () => {
    if (document.visibilityState === 'visible' && shownAt && (Date.now() - shownAt) / 1000 >= ttl - 1 && !fetching) {
      next = null;
      fetchQr().then(draw).catch(() => {});
    }
  };
  document.addEventListener('visibilitychange', onVisible);
  cleanups.push(() => { dead = true; document.removeEventListener('visibilitychange', onVisible); });
}

function paint(me) {
  const key = JSON.stringify([me.balance, me.history.length, me.expires_at]);
  if (key === last) return;
  const changed = last && JSON.parse(last)[0] !== me.balance;
  if (changed) {
    const d = me.balance - prevBalance;
    toast(d > 0 ? `+${d} ${bonusWord(d)} 🎉` : `Баланс: ${me.balance} ${bonusWord(me.balance)}`);
    haptic([14, 30, 14]);
  }
  last = key;
  $('#bal').innerHTML = balanceBlock(me.balance, prevBalance);
  animateNumbers($('#bal'));
  prevBalance = me.balance;
  let note = '';
  if (me.expires_at) {
    const days = Math.ceil((me.expires_at * 1000 - Date.now()) / 86400000);
    note = days <= 7 ? ` ⌛ Бонусы сгорят через ${Math.max(days, 0)} дн. — загляните за покупкой.`
      : ` Бонусы сгорят ${new Date(me.expires_at * 1000).toLocaleDateString('ru-RU')}, если не будет покупок.`;
  } else if (me.expire_days > 0) {
    note = ` Бонусы сгорают, если ${me.expire_days} дн. не покупать.`;
  }
  $('#rules').textContent = `Начисляем ${me.earn_percent}% с каждой покупки. Бонусами можно оплатить до ${me.max_spend_percent}% чека.` + note;
  $('#hist').innerHTML = me.history.length
    ? me.history.map(h => `<li><span>Покупка ${rub(h.amount)}
        <span class="muted">· ${esc(h.location || '')}</span><br><span class="muted" style="font-size:13px">${fmtDate(h.created_at)}</span></span>
        <span style="font-size:18px">${purchaseDelta(h)}</span></li>`).join('')
    : '<li class="muted">Пока пусто — самое время за первой покупкой</li>';
}

async function boot() {
  clearTimers();
  last = '';
  skeleton();
  try { cfg = cfg || await api('/api/config'); }
  catch (e) {
    view.innerHTML = `<div class="card center"><p class="lead">Сайт временно недоступен</p><p class="muted">${esc(e.message)}</p></div>`;
    return;
  }
  $('#shop').textContent = '☕ ' + cfg.shop_name;
  document.title = cfg.shop_name + ' — бонусная карта';
  try { showCard(await api('/api/me')); } catch { showLogin(); }
}

$('#logout').onclick = async () => {
  try { await disablePush(); } catch { /* не мешаем выходу */ }     // чтобы уведомления прежнего клиента не шли на это устройство
  try { if (window.AndroidApp && AndroidApp.clearSession) AndroidApp.clearSession(); } catch { /* старая версия */ }
  await api('/api/logout', 'POST', {});
  prevBalance = 0; authMode = 'login'; boot();
};
boot();
</script>
</body>
</html>
