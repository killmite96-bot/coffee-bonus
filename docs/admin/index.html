<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Админка — бонусная система</title>
<link rel="icon" href="../assets/icon.svg">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="wrap wide">
  <div class="brand"><h1>⚙️ Управление сетью</h1><button class="ghost small" id="logout" hidden>Выйти</button></div>
  <div id="view" class="view"></div>
</div>
<script src="../assets/config.js"></script>
<script src="../assets/common.js"></script>
<script>
const view = $('#view');
let tab = 'stats';
const TABS = [['stats', 'Обзор'], ['clients', 'Клиенты'], ['locations', 'Точки'], ['staff', 'Сотрудники'], ['reports', 'Отчёты'], ['mail', 'Рассылки'], ['rules', 'Правила']];
const strike = r => r.cancelled ? ' style="opacity:.5;text-decoration:line-through"' : '';

async function cancelEvent(id, after) {
  if (!await confirmSheet('Отменить покупку?', 'Бонусы будут пересчитаны, клиент получит уведомление.', 'Отменить покупку')) return;
  try { await api('/api/admin/cancel', 'POST', { event_id: id }); toast('Покупка отменена'); after(); }
  catch (e) { toast(e.message, 'err'); }
}
const cancelBtn = r => r.cancelled ? '' : `<button class="ghost small" data-cancel="${r.id}">Отменить</button>`;

function showLogin() {
  $('#logout').hidden = true;
  view.innerHTML = `
    <div class="card" style="max-width:420px">
      <label for="pw">Пароль администратора</label>
      <input id="pw" type="text" class="secret" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      <p></p><button class="big" id="go">Войти</button>
      <p class="muted">Пароль задан при установке базы. Сменить его можно в этой панели: «Правила» → «Пароль администратора».</p>
    </div>`;
  const go = async () => {
    try { await api('/api/admin/login', 'POST', { password: $('#pw').value }); boot(); }
    catch (e) { toast(e.message, 'err'); }
  };
  $('#go').onclick = go;
  $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

function shell() {
  $('#logout').hidden = false;
  view.innerHTML = `<div class="tabs">${TABS.map(([k, n]) =>
    `<button class="${k === tab ? 'on' : ''}" data-t="${k}">${n}</button>`).join('')}</div><div id="body"></div>`;
  view.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
}

async function render() {
  shell();
  try { await ({ stats, clients, locations, staff, reports, mail, rules }[tab])(); }
  catch (e) { if (e.status === 401) showLogin(); else toast(e.message, 'err'); }
}

async function stats() {
  const s = await api('/api/admin/stats'), t = s.totals;
  const lo = await api('/api/admin/loyalty').catch(() => ({}));
  $('#body').innerHTML = (lo.weak_admin || lo.weak_pin ? `<div class="card" style="border:1.5px solid var(--err)"><h2>⚠️ Слабые пароли</h2>
      <p class="muted" style="margin:0">${lo.weak_admin ? 'Пароль администратора — тестовый <b>1234</b> (сменить: «Правила» → «Пароль администратора»). ' : ''}${lo.weak_pin ? 'У одного из сотрудников PIN тестовый <b>1234</b> (добавьте каждому своего на вкладке «Сотрудники» и отключите старого). ' : ''}Смените их до запуска для настоящих клиентов.</p></div>` : '') + `
    <div class="kpis">
      <div class="kpi"><span class="muted">Клиентов</span><b><span class="num" data-to="${t.users}">0</span></b></div>
      <div class="kpi"><span class="muted">Выручка сегодня</span><b><span class="num" data-to="${t.revenue_today}">0</span> ₽</b></div>
      <div class="kpi"><span class="muted">Покупок сегодня</span><b><span class="num" data-to="${t.purchases_today}">0</span></b></div>
      <div class="kpi"><span class="muted">Выручка всего</span><b><span class="num" data-to="${t.revenue}">0</span> ₽</b></div>
      <div class="kpi"><span class="muted">Начислено бонусов</span><b><span class="num" data-to="${t.earned}">0</span></b></div>
      <div class="kpi"><span class="muted">Списано бонусов</span><b><span class="num" data-to="${t.spent}">0</span></b></div>
      <div class="kpi"><span class="muted">Бонусов на руках у клиентов</span><b><span class="num" data-to="${t.outstanding}">0</span></b></div>
    </div>
    <div class="card scroll"><h2>По точкам</h2><table>
      <tr><th>Точка</th><th>Покупок</th><th>Выручка</th><th>Начислено</th><th>Списано</th></tr>
      ${s.locations.map(l => `<tr><td>${esc(l.name)}</td><td>${l.purchases}</td><td>${rub(l.revenue)}</td>
        <td>${l.earned}</td><td>${l.spent}</td></tr>`).join('')}
    </table></div>
    <div class="card scroll"><h2>Последние 7 дней</h2><table>
      <tr><th>День</th><th>Покупок</th><th>Выручка</th><th>Начислено</th><th>Списано</th></tr>
      ${s.days.map(d => `<tr><td>${esc(d.day)}</td><td>${d.purchases}</td><td>${rub(d.revenue)}</td>
        <td>${d.earned}</td><td>${d.spent}</td></tr>`).join('')
        || '<tr><td colspan="5" class="muted">Данных пока нет</td></tr>'}
    </table></div>
    <div class="card scroll"><h2>Журнал покупок</h2><table>
      <tr><th>Когда</th><th>Чек</th><th>Бонусы</th><th>Клиент</th><th>Точка</th><th>Сотрудник</th><th></th></tr>
      ${s.recent.map(r => `<tr${strike(r)}><td>${fmtDate(r.created_at)}</td><td>${rub(r.amount)}</td>
        <td>${purchaseDelta(r)}</td><td>${esc(r.client)}</td><td>${esc(r.location || '')}</td>
        <td>${esc(r.staff || '')}</td><td>${cancelBtn(r)}</td></tr>`).join('')
        || '<tr><td colspan="7" class="muted">Покупок пока нет</td></tr>'}
    </table></div>`;
  animateNumbers($('#body'));
  view.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => cancelEvent(+b.dataset.cancel, stats));
}

async function clients(q = '') {
  const d = await api('/api/admin/clients', 'POST', { q });
  $('#body').innerHTML = `
    <div class="card"><div class="row">
      <input id="q" placeholder="Поиск: имя, @username или номер карты" value="${esc(q)}">
      <button id="find" style="flex:0 0 auto">Найти</button></div></div>
    <div id="detail"></div>
    <div class="card scroll"><h2>Клиенты (${d.total})</h2><table>
      <tr><th>Карта</th><th>Имя</th><th>Баланс</th><th>Покупок</th><th>Потратил всего</th><th>Был последний раз</th></tr>
      ${d.items.map(c => `<tr data-id="${c.id}" style="cursor:pointer">
        <td>№ ${c.id}</td>
        <td>${esc(c.name)} ${c.login ? `<span class="muted">${esc(c.login)}</span>` : c.username ? `<span class="muted">@${esc(c.username)}</span>` : ''}</td>
        <td><b>${c.balance}</b> ${bonusWord(c.balance)}</td><td>${c.purchases}</td><td>${rub(c.turnover)}</td>
        <td>${c.last_visit ? fmtDate(c.last_visit) : '—'}</td></tr>`).join('')
        || '<tr><td colspan="6" class="muted">Никого не нашли</td></tr>'}
    </table></div>`;
  const find = () => clients($('#q').value);
  $('#find').onclick = find;
  $('#q').addEventListener('keydown', e => { if (e.key === 'Enter') find(); });
  view.querySelectorAll('tr[data-id]').forEach(r => r.onclick = () => clientDetail(+r.dataset.id));
}

async function clientDetail(id) {
  const d = await api('/api/admin/client', 'POST', { id });
  $('#detail').innerHTML = `
    <div class="card scroll"><h2>${esc(d.user.name)} <span class="muted">· карта № ${d.user.id}</span></h2>
      <div class="row" style="align-items:center;margin-bottom:6px">
        <span class="muted">${d.user.login ? 'Логин: <b>' + esc(d.user.login) + '</b>' : d.user.username ? 'Вход через Telegram: @' + esc(d.user.username) : 'Вход через Telegram'}</span>
        ${d.user.login ? '<button class="ghost small" id="resetpw" style="flex:0 0 auto">Сбросить пароль</button>' : ''}
      </div>
      <p class="muted">Баланс: <b>${d.balance}</b> ${bonusWord(d.balance)} · начислено за всё время: ${d.earned_total}
        · списано: ${d.spent_total} · покупок: ${d.purchases} на ${rub(d.turnover)}</p>
      <table><tr><th>Когда</th><th>Чек</th><th>Бонусы</th><th>Точка</th><th>Сотрудник</th><th></th></tr>
      ${d.history.map(r => `<tr${strike(r)}><td>${fmtDate(r.created_at)}</td><td>${rub(r.amount)}</td>
        <td>${purchaseDelta(r)}</td><td>${esc(r.location || '')}</td><td>${esc(r.staff || '')}</td>
        <td>${cancelBtn(r)}</td></tr>`).join('')
        || '<tr><td colspan="6" class="muted">Покупок пока нет</td></tr>'}</table></div>`;
  const rp = $('#resetpw');
  if (rp) rp.onclick = () => {
    const s = openSheet(`<h2 style="text-align:center">Новый пароль</h2>
      <p class="muted center" style="margin:0 0 6px">Для клиента ${esc(d.user.name)} (${esc(d.user.login)}). Его старые входы закроются, а новый пароль нужно будет ему сообщить.</p>
      <label for="np">Новый пароль</label><input id="np" type="text" autocomplete="off" placeholder="не короче 6 символов">
      <p style="margin:14px 0 0"></p><button class="big" id="np-go">Сменить пароль</button>
      <p style="margin:8px 0 0"></p><button class="big ghost" id="np-no">Отмена</button>`);
    s.el.querySelector('#np-no').onclick = () => s.close();
    s.el.querySelector('#np-go').onclick = async () => {
      try {
        await api('/api/admin/client-password', 'POST', { id, password: s.el.querySelector('#np').value });
        s.close(); toast('Пароль изменён');
      } catch (e) { toast(e.message, 'err'); }
    };
    setTimeout(() => s.el.querySelector('#np').focus(), 350);
  };
  $('#detail').scrollIntoView({ behavior: 'smooth' });
  $('#detail').querySelectorAll('[data-cancel]').forEach(b =>
    b.onclick = () => cancelEvent(+b.dataset.cancel, () => clientDetail(id)));
}

async function locations() {
  const { items } = await api('/api/admin/locations');
  $('#body').innerHTML = `
    <div class="card"><h2>Новая точка</h2>
      <div class="row"><input id="name" placeholder="Например, Кофейня на Ленина, 5">
      <button id="add" style="flex:0 0 auto">Добавить</button></div></div>
    <div class="card"><h2>Точки сети</h2><ul class="list">
      ${items.map(l => `<li><span>${esc(l.name)}</span>
        <button class="ghost small" data-del="${l.id}">Закрыть</button></li>`).join('')}</ul></div>`;
  $('#add').onclick = async () => {
    try { await api('/api/admin/locations', 'POST', { name: $('#name').value }); locations(); }
    catch (e) { toast(e.message, 'err'); }
  };
  view.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!await confirmSheet('Закрыть точку?', 'Её сотрудники тоже потеряют доступ. История сохранится.', 'Закрыть точку')) return;
    await api('/api/admin/locations/' + b.dataset.del, 'DELETE'); locations();
  });
}

async function staff() {
  const [{ items }, locs] = await Promise.all([api('/api/admin/staff'), api('/api/admin/locations')]);
  $('#body').innerHTML = `
    <div class="card"><h2>Новый сотрудник</h2>
      <div class="row">
        <div><label for="sn">Имя</label><input id="sn"></div>
        <div><label for="sl">Точка</label><select id="sl">${locs.items.map(l =>
          `<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></div>
        <div><label for="sp">PIN (4–8 цифр)</label><input id="sp" inputmode="numeric" maxlength="8"></div>
      </div><p></p><button id="add">Добавить</button></div>
    <div class="card"><h2>Сотрудники</h2><ul class="list">
      ${items.map(s => `<li><span>${esc(s.name)} <span class="muted">· ${esc(s.location)}</span></span>
        <button class="ghost small" data-del="${s.id}">Отключить</button></li>`).join('')}</ul></div>`;
  $('#add').onclick = async () => {
    try {
      await api('/api/admin/staff', 'POST',
        { name: $('#sn').value, location_id: +$('#sl').value, pin: $('#sp').value });
      staff();
    } catch (e) { toast(e.message, 'err'); }
  };
  view.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!await confirmSheet('Отключить сотрудника?', 'Он больше не сможет войти на кассу.', 'Отключить')) return;
    await api('/api/admin/staff/' + b.dataset.del, 'DELETE'); staff();
  });
}

// ---------------------------------------------------------------- отчёты
let repRange = { days: 30, from: '', to: '' };
const isoDay = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const bar = (label, value, max, text) => `
  <div style="display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;margin:5px 0;font-size:14px">
    <span class="muted">${esc(label)}</span>
    <span style="background:var(--fill);border-radius:8px;height:14px;overflow:hidden"><i style="display:block;height:100%;width:${max ? Math.max(value ? 2 : 0, Math.round(value / max * 100)) : 0}%;background:var(--brand);border-radius:8px"></i></span>
    <b style="font-variant-numeric:tabular-nums">${text}</b></div>`;

async function reports() {
  let from = repRange.from, to = repRange.to;
  if (!from && repRange.days) {
    const now = new Date();
    to = isoDay(now); from = isoDay(new Date(now.getTime() - (repRange.days - 1) * 86400000));
  }
  const r = await api('/api/admin/report', 'POST', { from, to });
  const staffRep = await api('/api/admin/report-staff', 'POST', { from, to }).catch(() => ({ items: [] }));
  const t = r.totals, byDay = Object.fromEntries(r.days.map(d => [d.day, d]));
  const days = [];
  for (let d = new Date(r.from + 'T12:00:00'); isoDay(d) <= r.to && days.length < 370; d = new Date(d.getTime() + 86400000)) {
    const k = isoDay(d); days.push([k, byDay[k] ? +byDay[k].revenue : 0, byDay[k] ? +byDay[k].purchases : 0]);
  }
  const shown = days.length > 31 ? days.filter((_, i) => i % Math.ceil(days.length / 31) === 0) : days;
  const maxRev = Math.max(0, ...shown.map(d => d[1])), maxHour = Math.max(0, ...r.hours.map(h => +h.purchases));
  const maxLoc = Math.max(0, ...r.locations.map(l => +l.revenue));
  const preset = n => `<button class="${repRange.days === n && !repRange.from ? '' : 'ghost'} small" data-days="${n}" style="flex:0 0 auto">${n} дн.</button>`;
  $('#body').innerHTML = `
    <div class="card"><h2>Период</h2>
      <div class="row" style="flex-wrap:wrap;gap:8px">${preset(7)}${preset(30)}${preset(90)}${preset(365)}</div>
      <div class="row" style="margin-top:12px;gap:8px">
        <input id="rf" type="date" value="${r.from}"><input id="rt" type="date" value="${r.to}">
        <button id="rgo" class="ghost" style="flex:0 0 auto">Показать</button></div>
      <p style="margin:12px 0 0"></p><button id="csv" class="ghost">Скачать выгрузку покупок (CSV)</button></div>
    <div class="kpis">
      <div class="kpi"><span>Выручка</span><b>${(+t.revenue).toLocaleString('ru')} ₽</b></div>
      <div class="kpi"><span>Покупок</span><b>${t.purchases}</b></div>
      <div class="kpi"><span>Средний чек</span><b>${(+t.avg_check).toLocaleString('ru')} ₽</b></div>
      <div class="kpi"><span>Покупателей</span><b>${t.clients}</b></div>
      <div class="kpi"><span>Новых покупателей</span><b>${r.new_clients}</b></div>
      <div class="kpi"><span>Вернулись</span><b>${r.returning_clients}</b></div>
      <div class="kpi"><span>Покупали 2+ раза</span><b>${r.repeat_clients}</b></div>
      <div class="kpi"><span>Регистраций</span><b>${r.registered}</b></div>
      <div class="kpi"><span>Начислено</span><b>${t.earned}</b></div>
      <div class="kpi"><span>Списано</span><b>${t.spent}</b></div></div>
    <div class="card"><h2>Выручка по дням</h2>${t.purchases
      ? shown.map(d => bar(d[0].slice(5).split('-').reverse().join('.'), d[1], maxRev, d[1].toLocaleString('ru') + ' ₽')).join('')
      : '<p class="muted">В этом периоде покупок не было.</p>'}</div>
    <div class="card"><h2>В какое время покупают</h2>${r.hours.length
      ? r.hours.map(h => bar(String(h.hour).padStart(2, '0') + ':00', +h.purchases, maxHour, h.purchases)).join('')
      : '<p class="muted">Нет данных.</p>'}</div>
    <div class="card"><h2>По точкам</h2>${r.locations.length
      ? r.locations.map(l => bar(l.name, +l.revenue, maxLoc, (+l.revenue).toLocaleString('ru') + ' ₽ · ' + l.purchases)).join('')
      : '<p class="muted">Нет данных.</p>'}</div>
    <div class="card scroll"><h2>По сотрудникам</h2><table>
      <tr><th>Сотрудник</th><th>Точка</th><th>Покупок</th><th>Сумма</th><th>Отменено</th></tr>
      ${staffRep.items.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.location)}</td><td>${x.purchases}</td>
        <td>${(+x.revenue).toLocaleString('ru')} ₽</td><td>${x.cancelled || ''}</td></tr>`).join('')
        || '<tr><td colspan="5" class="muted">Нет данных</td></tr>'}</table></div>
    <div class="card scroll"><h2>Лучшие клиенты</h2><table>
      <tr><th>Клиент</th><th>Покупок</th><th>Сумма</th></tr>
      ${r.top.map(c => `<tr><td>${esc(c.name)} <span class="muted">№${c.id}</span></td><td>${c.purchases}</td><td>${(+c.revenue).toLocaleString('ru')} ₽</td></tr>`).join('')
        || '<tr><td colspan="3" class="muted">Нет данных</td></tr>'}</table></div>`;
  document.querySelectorAll('[data-days]').forEach(b => b.onclick = () => { repRange = { days: +b.dataset.days, from: '', to: '' }; render(); });
  $('#rgo').onclick = () => {
    if (!$('#rf').value || !$('#rt').value) return toast('Укажите обе даты', 'err');
    repRange = { days: 0, from: $('#rf').value, to: $('#rt').value }; render();
  };
  $('#csv').onclick = async () => {
    try {
      const x = await api('/api/admin/export', 'POST', { from: r.from, to: r.to });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['﻿' + x.csv], { type: 'text/csv;charset=utf-8' }));
      a.download = `pokupki_${r.from}_${r.to}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      toast(`Выгружено строк: ${x.rows}`);
    } catch (e) { toast(e.message, 'err'); }
  };
}

// ---------------------------------------------------------------- рассылки
async function mail() {
  const b = await api('/api/admin/broadcasts'), c = b.counts;
  const names = { all: 'всем клиентам', inactive: 'не заходившим 30+ дней', with_balance: 'у кого есть бонусы' };
  $('#body').innerHTML = `
    <div class="card" style="max-width:560px"><h2>Новая рассылка</h2>
      <label for="mt">Заголовок</label><input id="mt" maxlength="60" placeholder="Например, Двойные бонусы в субботу">
      <label for="mb">Текст</label><textarea id="mb" maxlength="300" rows="4" placeholder="Коротко и по делу"></textarea>
      <label for="ma">Кому</label>
      <select id="ma">
        <option value="all">Всем клиентам (${c.all})</option>
        <option value="with_balance">Тем, у кого есть бонусы (${c.with_balance})</option>
        <option value="inactive">Давно не покупали — 30+ дней (${c.inactive})</option></select>
      <p class="muted" style="font-size:13px">Сообщение попадёт во «Входящие» клиента на сайте и в приложении,
        придёт push на устройства с включёнными уведомлениями (сейчас клиентов с push: ${c.push_clients})
        и в Telegram, если клиент заходил через него. Чаще раза в полминуты отправлять нельзя.</p>
      <button id="send">Отправить</button></div>
    <div class="card scroll"><h2>Отправленные</h2><table>
      <tr><th>Когда</th><th>Заголовок</th><th>Кому</th><th>Получили</th></tr>
      ${b.items.map(m => `<tr><td>${fmtDate(m.created_at)}</td><td>${esc(m.title)}<div class="muted" style="font-size:13px">${esc(m.body)}</div></td>
        <td>${esc(names[m.audience] || m.audience)}</td><td>${m.sent}</td></tr>`).join('')
        || '<tr><td colspan="4" class="muted">Пока ничего не отправляли</td></tr>'}</table></div>`;
  $('#send').onclick = async () => {
    const title = $('#mt').value.trim(), body = $('#mb').value.trim(), audience = $('#ma').value;
    if (!title || !body) return toast('Введите заголовок и текст', 'err');
    if (!await confirmSheet('Отправить рассылку?', `«${title}» — ${names[audience]}. Это нельзя отозвать.`, 'Отправить')) return;
    try {
      const r = await api('/api/admin/broadcast', 'POST', { title, body, audience });
      toast(`Отправлено клиентам: ${r.sent}`); mail();
    } catch (e) { toast(e.message, 'err'); }
  };
}

async function rules() {
  const s = await api('/api/admin/settings'), lo = await api('/api/admin/loyalty');
  $('#body').innerHTML = `
    <div class="card" style="max-width:560px"><h2>Правила программы</h2>
      <label for="e">Сколько % от оплаченной суммы возвращается бонусами</label>
      <input id="e" type="number" min="0" max="100" value="${s.earn_percent}">
      <label for="m">Какую долю чека можно оплатить бонусами, %</label>
      <input id="m" type="number" min="0" max="100" value="${s.max_spend_percent}">
      <label for="x">Максимальная сумма одного чека, ₽ (защита от опечаток)</label>
      <input id="x" type="number" min="100" max="1000000" value="${s.max_check}">
      <label style="display:flex;gap:14px;align-items:center;justify-content:space-between;color:var(--ink);text-transform:none;letter-spacing:0;font-size:17px;font-weight:500;margin:18px 4px 6px">
        <span>Присылать клиентам уведомления в Telegram</span>
        <input id="nt" type="checkbox" ${s.notify ? 'checked' : ''}></label>
      <label for="ex">Через сколько дней без покупок бонусы сгорают (0 — не сгорают)</label>
      <input id="ex" type="number" min="0" max="3650" value="${s.expire_days}">
      <label for="sb">Сколько бонусов дарить за регистрацию (0 — не дарить)</label>
      <input id="sb" type="number" min="0" max="10000" value="${s.signup_bonus}">
      <p class="muted">1 бонус = 1 ₽. Бонусы начисляются с суммы, которую клиент реально оплатил деньгами,
        то есть за вычетом списанных бонусов. Изменение правил действует на новые покупки, уже начисленные
        бонусы не меняются.</p>
      <button id="save">Сохранить</button></div>
    <div class="card" style="max-width:560px"><h2>Уровни, день рождения, акции</h2>
      <p class="muted" style="margin:0 0 6px">Уровни считаются по сумме всех покупок клиента. Процент уровня заменяет базовый, если он выше. 0 в пороге — уровень выключен.</p>
      <label for="t1f">«Серебро»: от какой суммы покупок, ₽</label><input id="t1f" type="number" min="0" value="${lo.tier1_from}">
      <label for="t1p">«Серебро»: сколько % возвращать</label><input id="t1p" type="number" min="0" max="100" value="${lo.tier1_percent}">
      <label for="t2f">«Золото»: от какой суммы покупок, ₽</label><input id="t2f" type="number" min="0" value="${lo.tier2_from}">
      <label for="t2p">«Золото»: сколько % возвращать</label><input id="t2p" type="number" min="0" max="100" value="${lo.tier2_percent}">
      <label for="bb">Подарок на день рождения, бонусов (0 — не дарить)</label><input id="bb" type="number" min="0" max="10000" value="${lo.birthday_bonus}">
      <p class="muted" style="margin:6px 0 0">Подарок приходит в день рождения и ещё 6 дней после него, один раз в год.</p>
      <label>Дни, когда бонусов больше</label>
      <div class="row" style="flex-wrap:wrap;gap:6px" id="pd">${['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map((n, i) =>
        `<button type="button" class="${lo.promo_days.includes(i + 1) ? '' : 'ghost'} small" data-d="${i + 1}" style="flex:0 0 auto;min-width:46px">${n}</button>`).join('')}</div>
      <label for="pm">Во сколько раз больше бонусов в эти дни</label><input id="pm" type="number" min="1" max="5" value="${lo.promo_mult}">
      <p></p><button id="saveLoy">Сохранить</button></div>
    <div class="card" style="max-width:560px"><h2>Пароль администратора</h2>
      <label for="pw1">Новый пароль (не короче 4 символов)</label>
      <input id="pw1" type="text" class="secret" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      <p></p><button id="savepw">Сменить пароль</button></div>
    <div class="card" style="max-width:560px"><h2>Push-уведомления клиентам</h2>
      <p class="muted" id="pushState" style="margin:0 0 12px">Проверяем…</p>
      <button id="pushSetup" class="ghost">Подключить</button>
      <p class="muted" style="margin:12px 0 0;font-size:13px">Уведомления приходят в браузер клиента (Chrome, Safari, Яндекс Браузер, сайт на главном экране). Внутри приложения-оболочки они не поддерживаются.</p></div>`;
  const refreshPush = async () => {
    try {
      const p = await api('/api/admin/push');
      $('#pushState').innerHTML = p.ready
        ? `<i class="dot ok"></i>Подключены. Устройств с уведомлениями: <b>${p.devices}</b> (клиентов: ${p.clients}).`
        : `<i class="dot bad"></i>Не подключены. ${p.functions_url ? 'Функция не ответила или ещё не создана.' : 'Нажмите «Подключить» после установки функции send-push (инструкция в README).'}`;
      $('#pushSetup').textContent = p.ready ? 'Проверить связь с функцией' : 'Подключить';
    } catch (e) { $('#pushState').textContent = e.message; }
  };
  $('#pushSetup').onclick = async () => {
    try {
      await api('/api/admin/push-setup', 'POST', { url: window.APP_CONFIG.SUPABASE_URL.replace(/\/$/, '') + '/functions/v1' });
      toast('Запрос отправлен, проверяем…');
      setTimeout(refreshPush, 3500);
    } catch (e) { toast(e.message, 'err'); }
  };
  refreshPush();
  document.querySelectorAll('#pd [data-d]').forEach(b => b.onclick = () => b.classList.toggle('ghost'));
  $('#saveLoy').onclick = async () => {
    try {
      await api('/api/admin/loyalty', 'POST', {
        tier1_from: $('#t1f').value, tier1_percent: $('#t1p').value, tier2_from: $('#t2f').value, tier2_percent: $('#t2p').value,
        birthday_bonus: $('#bb').value, promo_mult: $('#pm').value,
        promo_days: [...document.querySelectorAll('#pd [data-d]')].filter(b => !b.classList.contains('ghost')).map(b => b.dataset.d).join('') });
      toast('Сохранено');
    } catch (e) { toast(e.message, 'err'); }
  };
  $('#savepw').onclick = async () => {
    try { await api('/api/admin/password', 'POST', { password: $('#pw1').value }); $('#pw1').value = ''; toast('Пароль изменён'); }
    catch (e) { toast(e.message, 'err'); }
  };
  $('#save').onclick = async () => {
    try {
      await api('/api/admin/settings', 'POST', {
        earn_percent: $('#e').value, max_spend_percent: $('#m').value,
        max_check: $('#x').value, notify: $('#nt').checked ? 1 : 0,
        expire_days: $('#ex').value, signup_bonus: $('#sb').value });
      toast('Сохранено');
    } catch (e) { toast(e.message, 'err'); }
  };
}

async function boot() {
  try { await api('/api/admin/settings'); render(); } catch { showLogin(); }
}
$('#logout').onclick = async () => { await api('/api/logout', 'POST', {}); boot(); };
boot();
</script>
</body>
</html>
