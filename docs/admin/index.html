<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Админка — бонусная система</title>
<link rel="icon" href="../assets/icon.svg">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="wrap wide">
  <div class="brand"><h1>⚙️ Управление сетью</h1><button class="ghost small" id="logout" hidden>Выйти</button></div>
  <div id="view" class="view"></div>
</div>
<script src="../assets/config.js"></script>
<script src="../assets/common.js"></script>
<script>
const view = $('#view');
let tab = 'stats';
const TABS = [['stats', 'Обзор'], ['clients', 'Клиенты'], ['locations', 'Точки'], ['staff', 'Сотрудники'], ['rules', 'Правила']];
const strike = r => r.cancelled ? ' style="opacity:.5;text-decoration:line-through"' : '';

async function cancelEvent(id, after) {
  if (!await confirmSheet('Отменить покупку?', 'Бонусы будут пересчитаны, клиент получит уведомление.', 'Отменить покупку')) return;
  try { await api('/api/admin/cancel', 'POST', { event_id: id }); toast('Покупка отменена'); after(); }
  catch (e) { toast(e.message, 'err'); }
}
const cancelBtn = r => r.cancelled ? '' : `<button class="ghost small" data-cancel="${r.id}">Отменить</button>`;

function showLogin() {
  $('#logout').hidden = true;
  view.innerHTML = `
    <div class="card" style="max-width:420px">
      <label for="pw">Пароль администратора</label>
      <input id="pw" type="text" class="secret" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      <p></p><button class="big" id="go">Войти</button>
      <p class="muted">Пароль задан при установке базы. Сменить его можно в этой панели: «Правила» → «Пароль администратора».</p>
    </div>`;
  const go = async () => {
    try { await api('/api/admin/login', 'POST', { password: $('#pw').value }); boot(); }
    catch (e) { toast(e.message, 'err'); }
  };
  $('#go').onclick = go;
  $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

function shell() {
  $('#logout').hidden = false;
  view.innerHTML = `<div class="tabs">${TABS.map(([k, n]) =>
    `<button class="${k === tab ? 'on' : ''}" data-t="${k}">${n}</button>`).join('')}</div><div id="body"></div>`;
  view.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
}

async function render() {
  shell();
  try { await ({ stats, clients, locations, staff, rules }[tab])(); }
  catch (e) { if (e.status === 401) showLogin(); else toast(e.message, 'err'); }
}

async function stats() {
  const s = await api('/api/admin/stats'), t = s.totals;
  $('#body').innerHTML = `
    <div class="kpis">
      <div class="kpi"><span class="muted">Клиентов</span><b><span class="num" data-to="${t.users}">0</span></b></div>
      <div class="kpi"><span class="muted">Выручка сегодня</span><b><span class="num" data-to="${t.revenue_today}">0</span> ₽</b></div>
      <div class="kpi"><span class="muted">Покупок сегодня</span><b><span class="num" data-to="${t.purchases_today}">0</span></b></div>
      <div class="kpi"><span class="muted">Выручка всего</span><b><span class="num" data-to="${t.revenue}">0</span> ₽</b></div>
      <div class="kpi"><span class="muted">Начислено бонусов</span><b><span class="num" data-to="${t.earned}">0</span></b></div>
      <div class="kpi"><span class="muted">Списано бонусов</span><b><span class="num" data-to="${t.spent}">0</span></b></div>
      <div class="kpi"><span class="muted">Бонусов на руках у клиентов</span><b><span class="num" data-to="${t.outstanding}">0</span></b></div>
    </div>
    <div class="card scroll"><h2>По точкам</h2><table>
      <tr><th>Точка</th><th>Покупок</th><th>Выручка</th><th>Начислено</th><th>Списано</th></tr>
      ${s.locations.map(l => `<tr><td>${esc(l.name)}</td><td>${l.purchases}</td><td>${rub(l.revenue)}</td>
        <td>${l.earned}</td><td>${l.spent}</td></tr>`).join('')}
    </table></div>
    <div class="card scroll"><h2>Последние 7 дней</h2><table>
      <tr><th>День</th><th>Покупок</th><th>Выручка</th><th>Начислено</th><th>Списано</th></tr>
      ${s.days.map(d => `<tr><td>${esc(d.day)}</td><td>${d.purchases}</td><td>${rub(d.revenue)}</td>
        <td>${d.earned}</td><td>${d.spent}</td></tr>`).join('')
        || '<tr><td colspan="5" class="muted">Данных пока нет</td></tr>'}
    </table></div>
    <div class="card scroll"><h2>Журнал покупок</h2><table>
      <tr><th>Когда</th><th>Чек</th><th>Бонусы</th><th>Клиент</th><th>Точка</th><th>Сотрудник</th><th></th></tr>
      ${s.recent.map(r => `<tr${strike(r)}><td>${fmtDate(r.created_at)}</td><td>${rub(r.amount)}</td>
        <td>${purchaseDelta(r)}</td><td>${esc(r.client)}</td><td>${esc(r.location || '')}</td>
        <td>${esc(r.staff || '')}</td><td>${cancelBtn(r)}</td></tr>`).join('')
        || '<tr><td colspan="7" class="muted">Покупок пока нет</td></tr>'}
    </table></div>`;
  animateNumbers($('#body'));
  view.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => cancelEvent(+b.dataset.cancel, stats));
}

async function clients(q = '') {
  const d = await api('/api/admin/clients', 'POST', { q });
  $('#body').innerHTML = `
    <div class="card"><div class="row">
      <input id="q" placeholder="Поиск: имя, @username или номер карты" value="${esc(q)}">
      <button id="find" style="flex:0 0 auto">Найти</button></div></div>
    <div id="detail"></div>
    <div class="card scroll"><h2>Клиенты (${d.total})</h2><table>
      <tr><th>Карта</th><th>Имя</th><th>Баланс</th><th>Покупок</th><th>Потратил всего</th><th>Был последний раз</th></tr>
      ${d.items.map(c => `<tr data-id="${c.id}" style="cursor:pointer">
        <td>№ ${c.id}</td>
        <td>${esc(c.name)} ${c.login ? `<span class="muted">${esc(c.login)}</span>` : c.username ? `<span class="muted">@${esc(c.username)}</span>` : ''}</td>
        <td><b>${c.balance}</b> ${bonusWord(c.balance)}</td><td>${c.purchases}</td><td>${rub(c.turnover)}</td>
        <td>${c.last_visit ? fmtDate(c.last_visit) : '—'}</td></tr>`).join('')
        || '<tr><td colspan="6" class="muted">Никого не нашли</td></tr>'}
    </table></div>`;
  const find = () => clients($('#q').value);
  $('#find').onclick = find;
  $('#q').addEventListener('keydown', e => { if (e.key === 'Enter') find(); });
  view.querySelectorAll('tr[data-id]').forEach(r => r.onclick = () => clientDetail(+r.dataset.id));
}

async function clientDetail(id) {
  const d = await api('/api/admin/client', 'POST', { id });
  $('#detail').innerHTML = `
    <div class="card scroll"><h2>${esc(d.user.name)} <span class="muted">· карта № ${d.user.id}</span></h2>
      <div class="row" style="align-items:center;margin-bottom:6px">
        <span class="muted">${d.user.login ? 'Логин: <b>' + esc(d.user.login) + '</b>' : d.user.username ? 'Вход через Telegram: @' + esc(d.user.username) : 'Вход через Telegram'}</span>
        ${d.user.login ? '<button class="ghost small" id="resetpw" style="flex:0 0 auto">Сбросить пароль</button>' : ''}
      </div>
      <p class="muted">Баланс: <b>${d.balance}</b> ${bonusWord(d.balance)} · начислено за всё время: ${d.earned_total}
        · списано: ${d.spent_total} · покупок: ${d.purchases} на ${rub(d.turnover)}</p>
      <table><tr><th>Когда</th><th>Чек</th><th>Бонусы</th><th>Точка</th><th>Сотрудник</th><th></th></tr>
      ${d.history.map(r => `<tr${strike(r)}><td>${fmtDate(r.created_at)}</td><td>${rub(r.amount)}</td>
        <td>${purchaseDelta(r)}</td><td>${esc(r.location || '')}</td><td>${esc(r.staff || '')}</td>
        <td>${cancelBtn(r)}</td></tr>`).join('')
        || '<tr><td colspan="6" class="muted">Покупок пока нет</td></tr>'}</table></div>`;
  const rp = $('#resetpw');
  if (rp) rp.onclick = () => {
    const s = openSheet(`<h2 style="text-align:center">Новый пароль</h2>
      <p class="muted center" style="margin:0 0 6px">Для клиента ${esc(d.user.name)} (${esc(d.user.login)}). Его старые входы закроются, а новый пароль нужно будет ему сообщить.</p>
      <label for="np">Новый пароль</label><input id="np" type="text" autocomplete="off" placeholder="не короче 6 символов">
      <p style="margin:14px 0 0"></p><button class="big" id="np-go">Сменить пароль</button>
      <p style="margin:8px 0 0"></p><button class="big ghost" id="np-no">Отмена</button>`);
    s.el.querySelector('#np-no').onclick = () => s.close();
    s.el.querySelector('#np-go').onclick = async () => {
      try {
        await api('/api/admin/client-password', 'POST', { id, password: s.el.querySelector('#np').value });
        s.close(); toast('Пароль изменён');
      } catch (e) { toast(e.message, 'err'); }
    };
    setTimeout(() => s.el.querySelector('#np').focus(), 350);
  };
  $('#detail').scrollIntoView({ behavior: 'smooth' });
  $('#detail').querySelectorAll('[data-cancel]').forEach(b =>
    b.onclick = () => cancelEvent(+b.dataset.cancel, () => clientDetail(id)));
}

async function locations() {
  const { items } = await api('/api/admin/locations');
  $('#body').innerHTML = `
    <div class="card"><h2>Новая точка</h2>
      <div class="row"><input id="name" placeholder="Например, Кофейня на Ленина, 5">
      <button id="add" style="flex:0 0 auto">Добавить</button></div></div>
    <div class="card"><h2>Точки сети</h2><ul class="list">
      ${items.map(l => `<li><span>${esc(l.name)}</span>
        <button class="ghost small" data-del="${l.id}">Закрыть</button></li>`).join('')}</ul></div>`;
  $('#add').onclick = async () => {
    try { await api('/api/admin/locations', 'POST', { name: $('#name').value }); locations(); }
    catch (e) { toast(e.message, 'err'); }
  };
  view.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!await confirmSheet('Закрыть точку?', 'Её сотрудники тоже потеряют доступ. История сохранится.', 'Закрыть точку')) return;
    await api('/api/admin/locations/' + b.dataset.del, 'DELETE'); locations();
  });
}

async function staff() {
  const [{ items }, locs] = await Promise.all([api('/api/admin/staff'), api('/api/admin/locations')]);
  $('#body').innerHTML = `
    <div class="card"><h2>Новый сотрудник</h2>
      <div class="row">
        <div><label for="sn">Имя</label><input id="sn"></div>
        <div><label for="sl">Точка</label><select id="sl">${locs.items.map(l =>
          `<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></div>
        <div><label for="sp">PIN (4–8 цифр)</label><input id="sp" inputmode="numeric" maxlength="8"></div>
      </div><p></p><button id="add">Добавить</button></div>
    <div class="card"><h2>Сотрудники</h2><ul class="list">
      ${items.map(s => `<li><span>${esc(s.name)} <span class="muted">· ${esc(s.location)}</span></span>
        <button class="ghost small" data-del="${s.id}">Отключить</button></li>`).join('')}</ul></div>`;
  $('#add').onclick = async () => {
    try {
      await api('/api/admin/staff', 'POST',
        { name: $('#sn').value, location_id: +$('#sl').value, pin: $('#sp').value });
      staff();
    } catch (e) { toast(e.message, 'err'); }
  };
  view.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!await confirmSheet('Отключить сотрудника?', 'Он больше не сможет войти на кассу.', 'Отключить')) return;
    await api('/api/admin/staff/' + b.dataset.del, 'DELETE'); staff();
  });
}

async function rules() {
  const s = await api('/api/admin/settings');
  $('#body').innerHTML = `
    <div class="card" style="max-width:560px"><h2>Правила программы</h2>
      <label for="e">Сколько % от оплаченной суммы возвращается бонусами</label>
      <input id="e" type="number" min="0" max="100" value="${s.earn_percent}">
      <label for="m">Какую долю чека можно оплатить бонусами, %</label>
      <input id="m" type="number" min="0" max="100" value="${s.max_spend_percent}">
      <label for="x">Максимальная сумма одного чека, ₽ (защита от опечаток)</label>
      <input id="x" type="number" min="100" max="1000000" value="${s.max_check}">
      <label style="display:flex;gap:14px;align-items:center;justify-content:space-between;color:var(--ink);text-transform:none;letter-spacing:0;font-size:17px;font-weight:500;margin:18px 4px 6px">
        <span>Присылать клиентам уведомления в Telegram</span>
        <input id="nt" type="checkbox" ${s.notify ? 'checked' : ''}></label>
      <p class="muted">1 бонус = 1 ₽. Бонусы начисляются с суммы, которую клиент реально оплатил деньгами,
        то есть за вычетом списанных бонусов. Изменение правил действует на новые покупки, уже начисленные
        бонусы не меняются.</p>
      <button id="save">Сохранить</button></div>
    <div class="card" style="max-width:560px"><h2>Пароль администратора</h2>
      <label for="pw1">Новый пароль (не короче 4 символов)</label>
      <input id="pw1" type="text" class="secret" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      <p></p><button id="savepw">Сменить пароль</button></div>`;
  $('#savepw').onclick = async () => {
    try { await api('/api/admin/password', 'POST', { password: $('#pw1').value }); $('#pw1').value = ''; toast('Пароль изменён'); }
    catch (e) { toast(e.message, 'err'); }
  };
  $('#save').onclick = async () => {
    try {
      await api('/api/admin/settings', 'POST', {
        earn_percent: $('#e').value, max_spend_percent: $('#m').value,
        max_check: $('#x').value, notify: $('#nt').checked ? 1 : 0 });
      toast('Сохранено');
    } catch (e) { toast(e.message, 'err'); }
  };
}

async function boot() {
  try { await api('/api/admin/settings'); render(); } catch { showLogin(); }
}
$('#logout').onclick = async () => { await api('/api/logout', 'POST', {}); boot(); };
boot();
</script>
</body>
</html>
